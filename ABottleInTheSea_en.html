<!DOCTYPE html>
<html lang="en-us">

<head>
    <link rel="shortcut icon" href="ABottleInTheSea/Assets/Logo_Bottle.svg" type="image/x-icon">
    <meta charset="utf-8" />
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video {
            height: 100%;
            width: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Video stays behind everything */
        }

        #click-zone {
            position: absolute;
            top: 5%;
            left: 42%;
            width: 16%;
            height: 40%;
            cursor: pointer;
            z-index: 3;
            display: none;
        }

        #click-zone-2 {
            position: absolute;
            top: 75%;
            left: 28%;
            width: 44%;
            height: 12%;
            cursor: pointer;
            z-index: 3;
            display: none;
        }

    </style>
</head>

<body>
    <div id="video-container">
        <video id="myVideo" autoplay muted>
            <source src="ABottleInTheSea/Animations/ABottleInTheSea.mp4" type="video/mp4" />
            Your browser does not support the video tag.
        </video>
        <div id="click-zone"></div> <!-- Big invisible button -->
        <div id="click-zone-2"></div> <!-- Big invisible button -->
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const clickZone = document.getElementById('click-zone');
        const clickZone2 = document.getElementById('click-zone-2');

        let currentSection = 0;
        let isLooping = false;

        const sections = [
            { start: 0, end: 10.02, next: 10.03, loop: true },     // click-zone
            { start: 10.03, end: 13.50, next: 13.51, loop: false }, // no click-zone
            { start: 13.51, end: 16.94, next: 16.95, loop: true },  // click-zone
            { start: 16.95, end: 24.28, next: 24.29, loop: false }, // no click-zone
            { start: 24.29, end: 30, next: "redirect", loop: true } // click-zone-2
        ];

        function setSection(index) {
            currentSection = index;
            isLooping = sections[index].loop;
            updateClickZones(); // Update visibility
            video.currentTime = sections[index].start;
            video.play();
        }

        function updateClickZones() {
            // Hide both by default
            clickZone.style.display = "none";
            clickZone2.style.display = "none";

            if ((currentSection === 0 || currentSection === 2) && isLooping) {
                clickZone.style.display = "block";
            } else if (currentSection === 4 && isLooping) {
                clickZone2.style.display = "block";
            }
        }

        clickZone.onclick = clickZone2.onclick = () => {
            const next = sections[currentSection].next;
            if (next === "redirect") {
                window.location.href = "indexBottle.html";
            } else {
                setSection(currentSection + 1);
            }
        };

        function monitorTime() {
            const pos = video.currentTime;
            const { start, end, loop } = sections[currentSection];
            const epsilon = 0.05;

            if (pos >= end - epsilon) {
                if (loop) {
                    video.currentTime = start;
                } else if (currentSection < sections.length - 1) {
                    setSection(currentSection + 1);
                }
            }

            requestAnimationFrame(monitorTime);
        }

        video.addEventListener('play', monitorTime);
        setSection(0);
    </script>

</body>

</html>
