    <main id="container-contact">
        <div class="contact-content">
            <!-- 🕊️ Pigeon -->
            <div id="pigeon-wrapper">
                <img src="Pigeon.svg" alt="Mister Pigeon" class="pigeon-img">
            </div>

            <!-- ✉️ Formulaire -->
            <div class="contact-form">
                <h2>Prenons contact !</h2>
                <form action="https://formspree.io/f/meoaqadr" method="POST">
                    <label for="name">Nom:</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email:</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message:</label>
                    <textarea id="message" name="message" required></textarea>

                    <div class="form-action-row">
                        <button type="submit">Envoyer</button>
                        <p class="coords-link">ou <a href="javascript:void(0)" onclick="toggleCoords()">appelez moi</a></p>
                    </div>
                </form>
            </div>

            <!-- 📞 Coordonnées (initialement cachées) -->
            <div class="contact-coords-wrapper hidden" id="coords-box">
                <div class="toggle-header" onclick="toggleCoords()">
                    <span>Coordonnées</span>
                    <span id="arrow">▸</span>
                </div>
                <div id="coordonnees">
                    <p><strong>Téléphone</strong><br>+33678154581</p>
                    <p><strong>Mail</strong><br><a href="mailto:jeannot.tiphaine@gmail.com">jeannot.tiphaine@gmail.com</a></p>
                </div>
            </div>
        </div>

        <a href="../Assets/2025TJResume-Strategic-planning-FR.pdf" download="2025TJResume-Strategic-planning-FR.pdf" target="_blank" class="cv-bubble">CV</a>

            <script>
        function toggleCoords() {
            const coordsBox = document.getElementById('coords-box');
            const arrow = document.getElementById('arrow');

            coordsBox.classList.toggle('hidden');
            arrow.classList.toggle('rotate');
        }
    </script>
