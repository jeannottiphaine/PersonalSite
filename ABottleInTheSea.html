<!DOCTYPE html>
<html lang="en-us">

<head>
    <link rel="shortcut icon" href="ABottleInTheSea/Assets/Logo_Bottle.svg" type="image/x-icon">
    <meta charset="utf-8" />
    <style>
        * {
            margin: 0;
            padding: 0;
            overflow: hidden;
        }

        #video-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        video {
            height: 100%;
            width: 100%;
            object-fit: cover;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* Video stays behind everything */
        }

        #click-zone {
            position: absolute;
            top: 30%;
            left: 30%;
            width: 40%;
            height: 40%;
            cursor: pointer;
            z-index: 3; /* Click zone always on top */
        }
    </style>
</head>

<body>
    <div id="video-container">
        <video id="myVideo" autoplay muted>
            <source src="ABottleInTheSea/Animations/ABottleInTheSea.mp4" type="video/mp4" />
            Votre navigateur ne supporte pas la balise vidéo.
        </video>
        <div id="click-zone"></div> <!-- Big invisible button -->
    </div>

    <script>
        const video = document.getElementById('myVideo');
        const clickZone = document.getElementById('click-zone');

        let currentSection = 0;
        let isLooping = false;

        const sections = [
            { start: 0, end: 10.02, next: 10.03, loop: true },
            { start: 10.03, end: 13.50, next: 13.51, loop: false },
            { start: 13.51, end: 16.94, next: 16.95, loop: true },
            { start: 16.95, end: 24.28, next: 24.29, loop: false },
            { start: 24.29, end: 30, next: "redirect", loop: true }
        ];

        function setSection(index) {
            currentSection = index;
            isLooping = sections[index].loop;
            video.currentTime = sections[index].start;
            video.play();
        }

        clickZone.onclick = () => {
            const next = sections[currentSection].next;
            if (next === "redirect") {
                window.location.href = "index.html";
            } else {
                setSection(currentSection + 1);
            }
        };

        function monitorTime() {
            const pos = video.currentTime;
            const { start, end, loop } = sections[currentSection];
            const epsilon = 0.05; // Higher precision tolerance

            if (pos >= end - epsilon) {
                if (loop) {
                    video.currentTime = start;
                } else if (currentSection < sections.length - 1) {
                    setSection(currentSection + 1);
                }
            }

            requestAnimationFrame(monitorTime); // Continue monitoring on every frame
        }

        video.addEventListener('play', monitorTime);
        setSection(0);
    </script>
</body>

</html>
